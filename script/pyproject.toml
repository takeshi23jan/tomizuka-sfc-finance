[project]
name = "hamamatsu-doc-downloader"
version = "0.1.0"
description = "Download documents linked from the Hamamatsu City page"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
